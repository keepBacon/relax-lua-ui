name: Finalize RiftUI R1 bundle and regression checks
on:
  push:
    paths:
      - ".github/workflows/finalize-r1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Build deterministic Luau distribution
        run: |
          pnpm install --frozen-lockfile
          node scripts/bundle.mjs
          node tests/runtime-r1.mjs
          pnpm exec tsc --noEmit
          node tests/config-crypto.mjs
          node tests/transfers.mjs
          node tests/http-proxy.mjs
          node tests/auth-server.mjs
      - name: Commit generated artifact and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/RiftUI.luau
          git rm -f .github/workflows/finalize-r1.yml
          git commit -m "build: sync RiftUI R1 distribution and verify lifecycle regressions"
          git push origin HEAD:main
