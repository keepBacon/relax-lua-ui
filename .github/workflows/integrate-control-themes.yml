name: Integrate RelaxUI color and control themes
on:
  push:
    paths:
      - ".github/workflows/integrate-control-themes.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relaxui-control-theme-migration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Apply verified Luau control-theme integration
        run: python3 scripts/dev/integrate-control-themes.py
      - name: Install locked dependencies and bundle
        run: |
          pnpm install --frozen-lockfile
          node scripts/bundle.mjs
          node --check scripts/bundle.mjs
      - name: Verify control skin implementation and existing UI
        run: |
          node tests/control-themes.mjs
          node tests/runtime-r1.mjs
          node tests/runtime-r2.mjs
          node tests/locale-zh.mjs
          node tests/subtabs.mjs
          node tests/preview-entry.mjs
          node tests/text-animation-background.mjs
          pnpm exec tsc --noEmit
          pnpm exec vite build
          node tests/config-crypto.mjs
          node tests/transfers.mjs
          node tests/auth-server.mjs
          node tests/http-proxy.mjs
      - name: Install pinned native Lune interpreter
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o /tmp/lune.zip
          mkdir -p /tmp/lunebin
          unzip -q /tmp/lune.zip -d /tmp/lunebin
          found=$(find /tmp/lunebin -type f -name 'lune*' | head -n 1)
          test -n "$found"
          if [ "$found" != "/tmp/lunebin/lune" ]; then cp "$found" /tmp/lunebin/lune; fi
          chmod +x /tmp/lunebin/lune
          echo "/tmp/lunebin" >> "$GITHUB_PATH"
      - name: Verify Luau control skin transitions and dock regression
        run: |
          lune run tests/control-themes-lune
          lune run tests/subtabs-lune
      - name: Publish source, examples and standalone build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/RiftUI.luau scripts/bundle.mjs lib/core/Locales/zh.luau examples/showcase.luau public/RiftUI.luau
          git rm -f scripts/dev/integrate-control-themes.py .github/workflows/integrate-control-themes.yml
          git commit -m "feat(ui): add live Color theme and Default/Rounded control theme"
          git push origin HEAD:main
