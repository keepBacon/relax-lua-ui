name: Finalize two-level navigation
on:
  push:
    paths:
      - ".github/workflows/finalize-subtabs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rift-subtab-build
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle and validate Luau source
        run: |
          node scripts/bundle.mjs
          node --check scripts/bundle.mjs
      - name: Navigation and existing regression tests
        run: |
          node tests/subtabs.mjs
          node tests/text-animation-background.mjs
          node tests/runtime-r1.mjs
          node tests/runtime-r2.mjs
          node tests/locale-zh.mjs
          node tests/preview-entry.mjs
      - name: TypeScript and production build
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vite build
      - name: Existing Node integration suite
        run: |
          node tests/transfers.mjs
          node tests/http-proxy.mjs
          node tests/config-crypto.mjs
          node tests/auth-server.mjs
      - name: Publish the generated single-file Luau library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/RiftUI.luau
          git rm -f .github/workflows/finalize-subtabs.yml
          git commit -m "build: release static two-level icon navigation and frosted rail"
          git push origin HEAD:main
