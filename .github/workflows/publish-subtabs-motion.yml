name: Publish anchored animated second-level rail
# Rerun after updating the subtab rail visibility assertion
on:
  push:
    paths:
      - ".github/workflows/publish-subtabs-motion.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rift-subtab-motion-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate single-file library
        run: node scripts/bundle.mjs
      - name: Static and production regression
        run: |
          node tests/subtabs.mjs
          node tests/preview-entry.mjs
          node tests/text-animation-background.mjs
          node tests/locale-zh.mjs
          node tests/runtime-r1.mjs
          node tests/runtime-r2.mjs
          pnpm exec tsc --noEmit
          pnpm exec vite build
      - name: Node integrations
        run: |
          node tests/config-crypto.mjs
          node tests/transfers.mjs
          node tests/auth-server.mjs
          node tests/http-proxy.mjs
      - name: Publish bundled Luau and retire one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/RiftUI.luau
          git rm -f .github/workflows/publish-subtabs-motion.yml
          git commit -m "build: release icon-anchored animated subtab rail"
          git push origin HEAD:main
