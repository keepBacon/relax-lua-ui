name: Import eight UI source archives (one-time)
on:
  push:
    paths:
      - ".github/workflows/import-ui-archives.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relax-ui-source-import
  cancel-in-progress: false

jobs:
  replace-repository:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Recover and verify original uploaded archive contents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          specs = json.loads(r'''[["AirFlow UI.zip","AirFlowUI","Xyraniz/VaultUI","ab8bcb29896dcd5c9c4ed3278e17a18fd665af3b",null,2,111653,"516a265f1ae7b19e6c9f043c725209a41c78731ea24945d46b3ee595f98db2da"],["Aster-UI-main.zip","AsterUI","podivichdev/Aster-UI","d4739e316554008d846397bc80390037cafb21cc","4cfaeca63cbbe4c43f83a297ca4f99f984cdf2f7",7,1439923,"9f961c5060349d66479e002e58f16f7544584e9e41a8fbda2bbb7d92bb031148"],["FlowUI-main.zip","FlowUI","deathstrat/FlowUI","78a9f9764e07446f19424f3353f564bc38ef94c1","35828cc72a3b993db848bb812d01c4d816ecdd09",3,1531386,"5180c6271f7b7c297e5d206488710df5390a933b27d5efcd4803589b208c56eb"],["MacUI-luau-main.zip","MacUI","Ngducok/MacUI-luau","62069e4e8d26ea93e931a475e1e00e14dfc2adbe","1651d1ccd50b8ee5ee1c9aa6520bc1b7bb68f833",44,5227723,"dbe457d32f08767967b7c98ce0e491f355d04ff522e3d8f01b44d8927d6caca3"],["OasisUI-main.zip","OasisUI","Mold53/OasisUI","5f921904f7e6d4f556d6fa19f3436a4ac4bbda4e","e66e651a9369e26d6156fd68467d4b8240ceadfd",66,896889,"185640ba2e923c2465d259c02999ff78355243472703a9e9714057ef4f20af17"],["VantaUI-main.zip","VantaUI","MrRos3/VantaUI","96d4765c929a332e7baf19164196843a6348803b","f8f5a090f75020ad0f4a0270ff5ee440fd096b9b",101,2635761,"eaed3939df16826f762d5761f5267c061d0757aee1f1e889295649b28e4fa075"],["Vantix-main.zip","Vantix","Snipez-Dev/Vantix","3d2a734dd6a4b434c4090101e82893fa570170ad","b0ab6335f83ec5f636c961b1abc0a2e8fc01e490",12,1068054,"e57a3e809ae9676708b2981b3ba2f83930f7d93e445544e09d6663d36f451221"],["riftui-main.zip","RiftUI","Naymmmm/riftui","412fd41dc8212ea91780a8593d5c6c5135c7c3fb","0cae6359f6e7f6fac71789addc3e45657cf1ef6b",196,6302191,"4455cadc1ff80bae5ed16fb637ffe9c6ca1ba8f87e3f30313d9d82887d598db4"]]''')
          root = Path(os.environ["RUNNER_TEMP"]) / "relax-ui-staged"
          if root.exists():
              shutil.rmtree(root)
          root.mkdir(parents=True)
          (root / "sources").mkdir()
          clones = Path(os.environ["RUNNER_TEMP"]) / "ui-source-clones"
          clones.mkdir(exist_ok=True)
          manifest = {"target": "keepBacon/relax-lua-ui", "source_archives": [], "files": []}
          for archive, folder, upstream, commit, expected_tree, expected_count, expected_bytes, archive_sha256 in specs:
              clone = clones / folder
              subprocess.run(["git", "clone", "-q", "--filter=blob:none", "--no-checkout", "https://github.com/" + upstream + ".git", str(clone)], check=True)
              subprocess.run(["git", "-C", str(clone), "checkout", "-q", commit], check=True)
              actual_commit = subprocess.check_output(["git", "-C", str(clone), "rev-parse", "HEAD"], text=True).strip()
              if actual_commit != commit:
                  raise SystemExit("Commit mismatch: " + folder)
              if expected_tree:
                  tree = subprocess.check_output(["git", "-C", str(clone), "rev-parse", "HEAD^{tree}"], text=True).strip()
                  if tree != expected_tree:
                      raise SystemExit("Git tree differs from uploaded ZIP: " + folder + " " + tree)
              target = root / "sources" / folder
              if folder == "AirFlowUI":
                  target.mkdir()
                  for basename, blob_sha in (("source.lua", "042a1b8b63f811543b5342b4a5b44a5a15314976"), ("example.lua", "61378f9e40853f155d0b13b52c74bdc6ac7cc6f9")):
                      source = clone / "Libraries" / "AirFlow" / basename
                      actual_blob = subprocess.check_output(["git", "hash-object", str(source)], text=True).strip()
                      if actual_blob != blob_sha:
                          raise SystemExit("AirFlow blob differs from uploaded ZIP: " + basename)
                      shutil.copy2(source, target / (basename + ".txt"))
              else:
                  shutil.copytree(clone, target, ignore=shutil.ignore_patterns(".git"), symlinks=False)
              files = sorted(p for p in target.rglob("*") if p.is_file())
              bytes_count = sum(p.stat().st_size for p in files)
              if len(files) != expected_count or bytes_count != expected_bytes:
                  raise SystemExit("Count/size differs from uploaded ZIP: " + folder)
              manifest["source_archives"].append({
                  "archive": archive, "source_dir": "sources/" + folder, "sha256": archive_sha256,
                  "files": expected_count, "bytes": expected_bytes,
                  "verified_git_source": upstream, "verified_commit": commit
              })
              for p in files:
                  data = p.read_bytes()
                  manifest["files"].append({"path": p.relative_to(root).as_posix(), "sha256": hashlib.sha256(data).hexdigest(), "bytes": len(data)})
          if len(manifest["files"]) != 431 or sum(f["bytes"] for f in manifest["files"]) != 19213580:
              raise SystemExit("Incomplete source import")
          (root / "IMPORT_MANIFEST.json").write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          (root / "README.md").write_text(
              "# UI Library Source Collection\n\n"
              "Reference workspace for developing a Luau UI library. "
              "All eight uploaded ZIPs are extracted into separate sources/ folders, preserving their original files and licenses. "
              "The archive top-level directory is stripped.\n\n"
              "See IMPORT_MANIFEST.json for 431 file checksums, archive checksums, and the pinned source commits. "
              "Every source import was checked against the exact Git tree or, for AirFlow, individual Git blobs.\n\n"
              "Original Relax UI files have been replaced. Git commit history remains available for recovery.\n",
              encoding="utf-8"
          )
          print("Validated 8 sources:", len(manifest["files"]), "files", 19213580, "bytes")
          PY

      - name: Replace old files and push one verified import commit
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git' "$RUNNER_TEMP/relax-ui-staged/" "$GITHUB_WORKSPACE/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: replace Relax UI with eight extracted UI libraries"
          git push origin HEAD:main
