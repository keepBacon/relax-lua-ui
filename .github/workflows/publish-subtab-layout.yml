name: Publish corrected subtab anchoring and panel spacing
on:
  push:
    paths:
      - ".github/workflows/publish-subtab-layout.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rift-subtab-layout-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Bundle actual release script
        run: node scripts/bundle.mjs
      - name: Check layout and existing regressions
        run: |
          node tests/subtabs.mjs
          node tests/text-animation-background.mjs
          node tests/runtime-r1.mjs
          node tests/runtime-r2.mjs
          node tests/locale-zh.mjs
          node tests/preview-entry.mjs
          pnpm exec tsc --noEmit
          pnpm exec vite build
          node tests/config-crypto.mjs
          node tests/transfers.mjs
          node tests/http-proxy.mjs
          node tests/auth-server.mjs
      - name: Commit regenerated Luau library
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/RiftUI.luau
          git rm -f .github/workflows/publish-subtab-layout.yml
          git commit -m "build: ship dock-local secondary rail and consistent panel spacing"
          git push origin HEAD:main
