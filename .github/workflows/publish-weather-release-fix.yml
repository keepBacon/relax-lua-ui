name: Publish final Aster Flow weather fixes
on:
  push:
    paths:
      - ".github/workflows/publish-weather-release-fix.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: relaxui-final-weather-bundle
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rebuild and static verification
        run: |
          node scripts/bundle.mjs
          node tests/weather-backdrop.mjs
          node tests/text-animation-background.mjs
          node tests/locale-zh.mjs
          node tests/preview-entry.mjs
          node tests/subtabs.mjs
          node tests/dock-groups.mjs
          node tests/control-themes.mjs
      - name: Verify Luau weather in native Lune
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o /tmp/lune.zip
          mkdir -p /tmp/lunebin
          unzip -q /tmp/lune.zip -d /tmp/lunebin
          found=$(find /tmp/lunebin -type f -name 'lune*' | head -n 1)
          test -n "$found"
          if [ "$found" != "/tmp/lunebin/lune" ]; then cp "$found" /tmp/lunebin/lune; fi
          chmod +x /tmp/lunebin/lune
          /tmp/lunebin/lune run tests/weather-backdrop-lune
      - name: Commit production single-file weather build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/RiftUI.luau
          git rm -f .github/workflows/publish-weather-release-fix.yml
          git commit -m "build: publish optimized weather lifecycle"
          git push origin HEAD:main
