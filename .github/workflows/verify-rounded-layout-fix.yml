name: Build and verify RelaxUI layout and rounded fixes
on:
  push:
    paths:
      - ".github/workflows/verify-rounded-layout-fix.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: relaxui-rounded-layout-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build single-file Luau and validate source
        run: |
          node scripts/bundle.mjs
          node tests/subtabs.mjs
          node tests/control-themes.mjs
          node tests/preview-entry.mjs
          node tests/locale-zh.mjs
          node tests/text-animation-background.mjs
          node tests/runtime-r1.mjs
          node tests/runtime-r2.mjs
      - name: Validate production and integration
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vite build
          node tests/config-crypto.mjs
          node tests/transfers.mjs
          node tests/http-proxy.mjs
          node tests/auth-server.mjs
      - name: Set up pinned Lune runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o /tmp/lune.zip
          mkdir -p /tmp/lunebin
          unzip -q /tmp/lune.zip -d /tmp/lunebin
          file=$(find /tmp/lunebin -type f -name 'lune*' | head -n 1)
          test -n "$file"
          if [ "$file" != "/tmp/lunebin/lune" ]; then cp "$file" /tmp/lunebin/lune; fi
          chmod +x /tmp/lunebin/lune
          echo "/tmp/lunebin" >> "$GITHUB_PATH"
      - name: Validate actual Luau widget and navigation behavior
        run: |
          lune run tests/control-themes-lune
          lune run tests/subtabs-lune
      - name: Publish updated single-file library
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/RiftUI.luau
          git rm -f .github/workflows/verify-rounded-layout-fix.yml
          git commit -m "build: release unified panels and rounded control fixes"
          git push origin HEAD:main
