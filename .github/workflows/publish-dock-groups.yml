name: Publish grouped RelaxUI Dock
on:
  push:
    paths:
      - ".github/workflows/publish-dock-groups.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: relaxui-grouped-dock-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Build standalone Luau
        run: node scripts/bundle.mjs
      - name: Verify grouped Dock and existing features
        run: |
          node tests/dock-groups.mjs
          node tests/subtabs.mjs
          node tests/control-themes.mjs
          node tests/preview-entry.mjs
          node tests/text-animation-background.mjs
          node tests/locale-zh.mjs
          node tests/runtime-r1.mjs
          node tests/runtime-r2.mjs
      - name: Production and integration validation
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vite build
          node tests/config-crypto.mjs
          node tests/transfers.mjs
          node tests/auth-server.mjs
          node tests/http-proxy.mjs
      - name: Install pinned native Lune
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o /tmp/lune.zip
          mkdir -p /tmp/lunebin
          unzip -q /tmp/lune.zip -d /tmp/lunebin
          found=$(find /tmp/lunebin -type f -name 'lune*' | head -n 1)
          test -n "$found"
          if [ "$found" != "/tmp/lunebin/lune" ]; then cp "$found" /tmp/lunebin/lune; fi
          chmod +x /tmp/lunebin/lune
          echo "/tmp/lunebin" >> "$GITHUB_PATH"
      - name: Native Luau simulation
        run: |
          lune run tests/dock-groups-lune
          lune run tests/subtabs-lune
          lune run tests/control-themes-lune
      - name: Publish generated library
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/RiftUI.luau
          git rm -f .github/workflows/publish-dock-groups.yml
          git commit -m "build: release grouped Dock with rightmost Search"
          git push origin HEAD:main
