name: Verify nested tabs with native Lune
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-luau:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download pinned Lune 0.11.1 binary
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o /tmp/lune.zip
          mkdir -p /tmp/lunebin
          unzip -q /tmp/lune.zip -d /tmp/lunebin
          find /tmp/lunebin -maxdepth 2 -type f -print
          found=$(find /tmp/lunebin -type f -name 'lune*' | head -n 1)
          test -n "$found"
          if [ "$found" != "/tmp/lunebin/lune" ]; then cp "$found" /tmp/lunebin/lune; fi
          chmod +x /tmp/lunebin/lune
          echo "/tmp/lunebin" >> "$GITHUB_PATH"
      - name: Build and run native Luau simulation
        run: |
          node scripts/bundle.mjs
          lune --version
          lune run tests/loader
          lune run tests/motion-state-lune
          lune run tests/module-cards-lune
          lune run tests/overlay-stack-lune
          lune run tests/complex-data-lune
          lune run tests/p2-controls-lune
          lune run tests/subtabs-lune
          lune run tests/control-themes-lune
          lune run tests/design-tokens-lune
          lune run tests/dock-groups-lune
          lune run tests/weather-backdrop-lune

      - name: R5 simulated Luau performance baseline
        run: |
          lune run tests/performance-lune
          node scripts/performance-report.mjs perf-baseline.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload R5 simulation benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relaxui-r5-simulation-baseline
          path: perf-baseline.json
          if-no-files-found: warn
