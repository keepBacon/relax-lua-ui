name: Finalize stable text and background switching
on:
  push:
    paths:
      - ".github/workflows/finalize-text-background.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rift-text-background-bundle
  cancel-in-progress: false

jobs:
  bundle-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Rebuild the standalone Luau library
        run: |
          node scripts/bundle.mjs
          node --check scripts/bundle.mjs
      - name: Validate text stability, background layers, locale and key gate
        run: |
          node tests/text-animation-background.mjs
          node tests/runtime-r1.mjs
          node tests/runtime-r2.mjs
          node tests/locale-zh.mjs
          node tests/preview-entry.mjs
      - name: Check existing integrations and production build
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vite build
          node tests/transfers.mjs
          node tests/http-proxy.mjs
          node tests/config-crypto.mjs
          node tests/auth-server.mjs
      - name: Commit generated distribution and remove one-time build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/RiftUI.luau
          git rm -f .github/workflows/finalize-text-background.yml
          git commit -m "build: ship stable text animations and background switching"
          git push origin HEAD:main
