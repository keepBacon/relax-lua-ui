name: Integrate Simplified Chinese locale
on:
  push:
    paths:
      - ".github/workflows/integrate-zh.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Integrate Chinese locale into RiftUI runtime
        run: python3 scripts/dev/add-zh-locale.py
      - name: Bundle and verify
        run: |
          pnpm install --frozen-lockfile
          node scripts/bundle.mjs
          node tests/locale-zh.mjs
          node tests/runtime-r1.mjs
          node tests/runtime-r2.mjs
          pnpm exec tsc --noEmit
          node tests/config-crypto.mjs
          node tests/transfers.mjs
      - name: Commit tested source and distribution
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/RiftUI.luau scripts/bundle.mjs src/docs/content.ts public/RiftUI.luau
          git rm -f scripts/dev/add-zh-locale.py .github/workflows/integrate-zh.yml
          git commit -m "feat(i18n): enable Simplified Chinese language selector"
          git push origin HEAD:main
