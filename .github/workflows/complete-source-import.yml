name: Complete verified source import media
on:
  push:
    paths:
      - ".github/workflows/complete-source-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore MacUI demo assets exactly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources/MacUI/demo
          sha=62069e4e8d26ea93e931a475e1e00e14dfc2adbe
          curl -fL --retry 3 "https://raw.githubusercontent.com/Ngducok/MacUI-luau/$sha/demo/demo.png" -o sources/MacUI/demo/demo.png
          curl -fL --retry 3 "https://raw.githubusercontent.com/Ngducok/MacUI-luau/$sha/demo/ui.mp4" -o sources/MacUI/demo/ui.mp4
          test "$(git hash-object sources/MacUI/demo/demo.png)" = "584941b92c46cd66b11930c007a92c981dfc1e10"
          test "$(git hash-object sources/MacUI/demo/ui.mp4)" = "075c207148217b03fbfed10ea6489bc32c18f880"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sources/MacUI/demo/demo.png sources/MacUI/demo/ui.mp4
          git rm -f .github/workflows/complete-source-import.yml
          git commit -m "fix: include two ignored MacUI media files in source import"
          git push origin HEAD:main
